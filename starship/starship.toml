format = """
$time\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "#fabd2f"

[character]
success_symbol = "[|](#fb4934)"
error_symbol = "[|](#fb4934 bold)"
vimcmd_symbol = "[|](#b8bb26)"

[git_branch]
format = "[$branch]($style) "
style = "#b8bb26"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](#d3869b) ($ahead_behind$stashed)]($style)"
style = "#8ec07c"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#a89984"

[cmd_duration]
format = "[$duration]($style) "
style = "#a89984"

[time]
disabled = false
format = "\\[[$time]($style)\\] "
time_format = "%H:%M"
style = "#a89984"

[python]
format = "[$virtualenv]($style) "
style = "#a89984"
